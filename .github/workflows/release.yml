name: 发布

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: '发布版本类型'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: '额外的发布备注（可选，支持 Markdown）'
        required: false
        type: string
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ---- 环境准备 ----
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: 安装依赖
        run: |
          pnpm install --frozen-lockfile
          # Fix husk issue during CI occasionally
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ---- 前置检查 ----
      - name: 运行测试
        run: pnpm run test:run

      - name: 构建项目
        run: pnpm run build

      # ---- 自动收集提取 Commit 组装 Release ----
      - name: 获取当前版本
        id: prev_version
        run: |
          PREV_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PREV_VERSION" >> $GITHUB_OUTPUT

      - name: 收集分支 Commit 并生成 CHANGELOG
        id: build_changelog
        run: |
          node scripts/release.cjs ${{ github.event.inputs.bump_type }}

      - name: 获取新版本
        id: new_version
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # 验证版本确实更新了
          if [ "${{ steps.prev_version.outputs.version }}" = "$NEW_VERSION" ]; then
            echo "::error::版本号未能更新，可能是没有检测到有效 Commit"
            exit 1
          fi

      - name: 提取 CHANGELOG 中本次版本的变更记录提取做 GitHub Release 草稿
        run: |
          VERSION="${{ steps.new_version.outputs.version }}"
          awk "/^## ${VERSION}/{found=1; next} /^## /{found=0} found" CHANGELOG.md > /tmp/changelog_content.txt

      # ---- 发布阶段：先推代码，再发 npm ----
      - name: 提交版本变更并推送
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v${{ steps.new_version.outputs.version }}" --no-verify
          git tag "v${{ steps.new_version.outputs.version }}"
          git push --atomic origin master "v${{ steps.new_version.outputs.version }}"
          
      - name: 发布到 npm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 组装 Release Body
        run: |
          VERSION="${{ steps.new_version.outputs.version }}"
          {
            cat /tmp/changelog_content.txt
            echo ""
            if [ -n "$RELEASE_NOTES" ]; then
              echo "## 备注"
              echo ""
              echo "$RELEASE_NOTES"
              echo ""
            fi
            echo "---"
            echo "**npm**: https://www.npmjs.com/package/ajax-hooker/v/${VERSION}"
          } > /tmp/release_body.md
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.new_version.outputs.version }}"
          name: "v${{ steps.new_version.outputs.version }}"
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
